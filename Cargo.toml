[package]
name = "docksmith"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[dependencies]
clap = { version = "=4.4.18", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
tar = "0.4"
glob = "0.3"
chrono = { version = "=0.4.34", features = ["serde"] }
walkdir = "2"
anyhow = "1"
tempfile = "=3.10.1"
libc = "0.2"

[dependencies.getrandom]
version = "=0.2.15"

[profile.release]
opt-level = 3
